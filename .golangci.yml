version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - gosec
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
          disabled: true
    gosec:
      excludes:
        - G104 # unhandled errors — errcheck already covers this
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
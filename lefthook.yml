# Local gates. Remote gates live in .github/workflows/ci.yml.
# Bypassing with --no-verify requires a documented emergency (AGENTS.md §6).

pre-commit:
  parallel: true
  commands:
    dart-format:
      glob: "*.dart"
      run: dart format {staged_files}
      stage_fixed: true
    dart-analyze:
      glob: "*.dart"
      run: dart analyze --fatal-infos {staged_files}
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    shfmt:
      glob: "*.sh"
      run: shfmt -w {staged_files}
      stage_fixed: true
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    secrets:
      run: gitleaks git --staged

commit-msg:
  commands:
    conventional:
      run: >
        head -1 {1} |
        grep -qE '^(Merge |Revert "|(feat|fix|chore|docs|test|refactor|perf|ci|build|revert)(\([a-z-]+\))?!?: .+)'

pre-push:
  commands:
    ci:
      run: just ci
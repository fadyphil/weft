[changelog]
header = "# Changelog\n\nAll notable changes to Weft. Conventional Commits + milestone tags.\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for c in commits %}- {{ c.message | split(pat="\n") | first }}{% if c.scope %} ({{ c.scope }}){% endif %}
{% endfor %}{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9]*"
sort_commits = "newest"
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Verification" },
  { message = "^ci|^build", group = "Tooling" },
  { message = "^chore", skip = true },
  { message = "^revert", group = "Reverted" },
]